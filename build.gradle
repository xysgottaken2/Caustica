tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	// Keep going past the default 100 diagnostics: the 26.2 → 26.3 port is verified by CI.
	it.options.compilerArgs += ["-Xmaxerrs", "500"]
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

tasks.withType(ProcessResources).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(AbstractArchiveTask).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	preserveFileTimestamps = false
	reproducibleFileOrder = true
}

tasks.named("jar", Jar).configure {
	from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
		into "META-INF"
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}

// ===== 26.3 integration verification (ported from the previous bootstrap) =====
// These tasks inspect resolved bytecode and the packaged JAR only; they never load Vulkan or a GPU.
tasks.register("verifyMinecraftAbi", VerifyMinecraftAbi) {
	group = "verification"
	description = "Checks the researched 26.3 integration points against resolved classfiles; does not load Vulkan."
	minecraftClasspath.from(configurations.compileClasspath)
	contractFile.set(layout.projectDirectory.file("docs/minecraft-26.3-abi.tsv"))
	reportFile.set(layout.buildDirectory.file("reports/minecraft-abi.txt"))
}

// Pass -PexpectBundledNatives=windows-x64,linux-x64 (the package job) to require the vendor natives
// that only exist after the shim jobs have run. Without it the check stays platform-agnostic.
def expectedNativePlatforms = (findProperty("expectBundledNatives") ?: "").toString()
		.split(",").collect { it.trim() }.findAll { !it.isEmpty() }

tasks.register("verifyModJar") {
	group = "verification"
	description = "Checks client metadata, mixin registration, packaged shaders and shim bundling."
	dependsOn tasks.named("jar")
	inputs.file(tasks.named("jar").flatMap { it.archiveFile })
	inputs.property("expectBundledNatives", expectedNativePlatforms.join(","))
	doLast {
		new ZipFile(tasks.named("jar").get().archiveFile.get().asFile).withCloseable { zip ->
			def entry = zip.getEntry("fabric.mod.json")
			if (entry == null) throw new GradleException("Missing fabric.mod.json")
			def metadata = zip.getInputStream(entry).withCloseable { new JsonSlurper().parse(it) }
			if (metadata.environment != "client" || metadata.id != "caustica" ||
					metadata.depends.minecraft != project.minecraft_version ||
					metadata.version != project.version.toString() || metadata.depends.java != ">=25" ||
					metadata.depends.fabricloader != ">=${project.loader_version}" ||
					metadata.entrypoints.main != ["dev.comfyfluffy.caustica.CausticaMod"] ||
					metadata.entrypoints.client != ["dev.comfyfluffy.caustica.client.CausticaClient"] ||
					metadata.mixins != ["caustica.mixins.json"]) {
				throw new GradleException("Unexpected mod metadata: ${metadata}")
			}
			if (zip.getEntry("dev/comfyfluffy/caustica/CausticaMod.class") == null ||
					zip.getEntry("META-INF/LICENSE.md") == null) {
				throw new GradleException("Missing compiled entrypoint or license")
			}
			["world.rgen.spv", "world.rchit.spv", "world.rahit.spv", "world.rmiss.spv",
			 "world_primary.rgen.spv", "shadow.rmiss.spv", "display.comp.spv", "svgf_reproject.comp.spv",
			 "exposure_hist.comp.spv", "sdr_present.comp.spv", "hdr_ui_composite.comp.spv",
			 "overlay_fullscreen_triangle.vert.spv", "block_outline.vert.spv"].each { shader ->
				if (zip.getEntry("caustica/rt/${shader}") == null) {
					throw new GradleException("Missing executable shader caustica/rt/${shader}")
				}
			}
			def mixinEntry = zip.getEntry("caustica.mixins.json")
			if (mixinEntry == null) throw new GradleException("Missing RT integration mixins")
			def mixins = zip.getInputStream(mixinEntry).withCloseable { new JsonSlurper().parse(it) }
			def requiredHooks = ["VulkanBackendMixin", "GpuDeviceAccessor", "RenderSystemMixin",
								 "GameRendererMixin", "LevelRendererMixin", "VulkanGpuSurfaceMixin"]
			if (!mixins.required || mixins.injectors.defaultRequire != 1 ||
					!mixins.client.containsAll(requiredHooks)) {
				throw new GradleException("Required RT hooks are not registered with fail-fast injection checks")
			}
			mixins.client.each { name ->
				def entryName = mixins.package.replace(".", "/") + "/" + name + ".class"
				if (zip.getEntry(entryName) == null) throw new GradleException("Missing compiled Mixin ${entryName}")
			}
			expectedNativePlatforms.each { platform ->
				def prefix = "caustica/natives/${platform}/"
				if (!zip.entries().any { it.name.startsWith(prefix) }) {
					throw new GradleException("Expected bundled natives for ${platform} in ${prefix}")
				}
			}
			def forbidden = zip.entries().findAll {
				it.name.startsWith("net/minecraft/") || it.name.startsWith("com/mojang/") ||
						it.name.startsWith("org/lwjgl/")
			}
			if (!forbidden.empty) throw new GradleException("Unexpected bundled runtime: ${forbidden*.name}")
		}
	}
}

check { dependsOn tasks.named("verifyMinecraftAbi"), tasks.named("verifyModJar") }
tasks.named("runClient") { dependsOn tasks.named("verifyMinecraftAbi") }
