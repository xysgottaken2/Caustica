name: Shader toolchain
description: >-
  Installs the SPIR-V toolchain used by the build (glslangValidator, slangc, spirv-val).
  Prefers the pinned LunarG Vulkan SDK and falls back to distro glslang/spirv-tools plus
  the official Slang release when the SDK download is unavailable.

inputs:
  vulkan-sdk-version:
    description: Vulkan SDK version to prefer
    required: false
    default: "1.4.350.0"
  vulkan-sdk-sha256:
    description: SHA-256 of the Linux Vulkan SDK archive
    required: false
    default: "b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2"
  slang-version:
    description: Slang release used by the fallback path
    required: false
    default: "2026.18"

runs:
  using: composite
  steps:
    - name: Download the pinned Vulkan SDK
      id: sdk
      shell: bash
      continue-on-error: true
      run: |
        set -euo pipefail
        version="${{ inputs.vulkan-sdk-version }}"
        archive="vulkansdk-linux-x86_64-${version}.tar.xz"
        url="https://sdk.lunarg.com/sdk/download/${version}/linux/${archive}"
        mkdir -p "${RUNNER_TEMP}/vulkan-sdk"
        curl --fail --location --retry 3 --retry-delay 5 \
          --output "${RUNNER_TEMP}/${archive}" "${url}"
        echo "${{ inputs.vulkan-sdk-sha256 }}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
        tar -xf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/vulkan-sdk"
        sdk_root=$(find "${RUNNER_TEMP}/vulkan-sdk" -type d -name x86_64 | head -n 1)
        test -n "${sdk_root}"
        echo "VULKAN_SDK=${sdk_root}" >> "${GITHUB_ENV}"
        # build.gradle resolves tools from ${VULKAN_SDK}/bin through PATH; add it explicitly.
        echo "${sdk_root}/bin" >> "${GITHUB_PATH}"

    - name: Fall back to distro glslang/spirv-tools and GitHub Slang
      if: steps.sdk.outcome != 'success'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y glslang-tools spirv-tools unzip
        version="${{ inputs.slang-version }}"
        mkdir -p "${RUNNER_TEMP}/slang"
        downloaded=""
        for asset in "slang-${version}-linux-x86_64.zip" "slang-${version}-linux-x86_64-glibc-2.28.zip"; do
          if curl --fail --location --retry 3 --retry-delay 5 \
            --output "${RUNNER_TEMP}/slang.zip" \
            "https://github.com/shader-slang/slang/releases/download/v${version}/${asset}"; then
            downloaded="${asset}"
            break
          fi
        done
        test -n "${downloaded}"
        unzip -o -q "${RUNNER_TEMP}/slang.zip" -d "${RUNNER_TEMP}/slang"
        slang_bin=$(find "${RUNNER_TEMP}/slang" -type f -name slangc | head -n 1)
        test -n "${slang_bin}"
        chmod +x "${slang_bin}"
        dirname "${slang_bin}" >> "${GITHUB_PATH}"

    - name: Report toolchain versions
      shell: bash
      run: |
        set -euo pipefail
        echo "VULKAN_SDK=${VULKAN_SDK:-<unset>}"
        glslangValidator --version | head -n 2
        slangc -version || slangc --version || true
        spirv-val --version || true
