name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "buildSrc/**"
      - "docs/minecraft-26.3-abi.tsv"
      - "native/**"
      - "shaders/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "buildSrc/**"
      - "docs/minecraft-26.3-abi.tsv"
      - "native/**"
      - "shaders/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      full:
        description: Also build the native shims and the bundled JAR
        type: boolean
        default: true

env:
  DLSS_SDK_REF: v310.7.0
  DLSS_SDK_PATH: third_party/DLSS
  FFX_SDK_REF: v1.1.4
  FFX_SDK_PATH: third_party/FidelityFX-SDK
  NRD_SDK_REF: v4.17.3
  NRD_SDK_PATH: third_party/NRD
  XESS_SDK_REF: v2.1.1
  XESS_SDK_PATH: third_party/xess
  NGX_SHIM_CONFIG: release
  NGX_VENDOR_CONFIG: rel
  VULKAN_SDK_VERSION: 1.4.350.0
  VULKAN_SDK_SHA256: b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2
  SLANG_VERSION: "2026.18"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane: Java 26.3 compile, unit tests, ABI/hook contracts and the packaged JAR.
  # No GPU and no Vulkan device is touched: CI cannot validate rendering behaviour.
  jvm:
    name: JVM, ABI and JAR checks (no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install shader toolchain
        uses: ./.github/actions/shader-tools
        with:
          vulkan-sdk-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-sdk-sha256: ${{ env.VULKAN_SDK_SHA256 }}
          slang-version: ${{ env.SLANG_VERSION }}
      # JUnit stays separate so a contract failure is reported as its own step.
      - name: Test the ABI verifier and hook contracts (synthetic classfiles)
        run: ./gradlew --no-daemon -p buildSrc test
      - name: Compile, test and verify the mod against resolved 26.3 bytecode
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon check verifyMinecraftAbi verifyModJar 2>&1 | tee build-output.log
      - name: Summarise compiler diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "### Gradle diagnostics"
            echo '```'
            grep -n -iE "error:|cannot find symbol|does not exist|FAILED|What went wrong|Could not find|Caused by" build-output.log | head -n 200
            echo '```'
            echo "### Tail"
            echo '```'
            tail -n 120 build-output.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload build log and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jvm-reports
          path: |
            build-output.log
            build/reports/
            build/test-results/
            build/libs/
            buildSrc/build/reports/
            buildSrc/build/test-results/
          if-no-files-found: ignore

  native-windows:
    name: Build Windows shims (NGX, FSR, NRD, XeSS)
    if: github.event_name != 'workflow_dispatch' || inputs.full
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout DLSS SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      - name: Configure NGX shim
        shell: pwsh
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G "Visual Studio 17 2022"
          -A x64
      - name: Build NGX shim
        shell: pwsh
        run: cmake --build build/cmake/ngx_shim --config Release
      - name: Upload Windows NGX shim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngxshim-windows-x64
          path: build/native/ngx_shim/release/ngxshim.dll
          if-no-files-found: error
      - name: Checkout AMD FidelityFX SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: ${{ env.FFX_SDK_REF }}
          path: ${{ env.FFX_SDK_PATH }}
          sparse-checkout: |
            PrebuiltSignedDLL
            ffx-api/include
      - name: Configure FSR shim
        shell: pwsh
        env:
          FFX_SDK: ${{ github.workspace }}/${{ env.FFX_SDK_PATH }}
        run: >
          cmake -S native/fsr_shim
          -B build/cmake/fsr_shim
          -G "Visual Studio 17 2022"
          -A x64
      - name: Build FSR shim
        shell: pwsh
        run: cmake --build build/cmake/fsr_shim --config Release
      - name: Upload Windows FSR shim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fsrshim-windows-x64
          path: |
            build/native/fsr_shim/release/fsrshim.dll
            build/native/fsr_shim/release/amd_fidelityfx_vk.dll
          if-no-files-found: error
      - name: Checkout NRD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVIDIA-RTX/NRD
          ref: ${{ env.NRD_SDK_REF }}
          path: ${{ env.NRD_SDK_PATH }}
      - name: Configure NRD shim
        shell: pwsh
        env:
          NRD_SDK: ${{ github.workspace }}/${{ env.NRD_SDK_PATH }}
        run: >
          cmake -S native/nrd_shim
          -B build/cmake/nrd_shim
          -G "Visual Studio 17 2022"
          -A x64
      - name: Build NRD shim
        shell: pwsh
        run: cmake --build build/cmake/nrd_shim --config Release
      - name: Upload Windows NRD shim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nrdshim-windows-x64
          path: build/native/nrd_shim/release/nrdshim.dll
          if-no-files-found: error
      - name: Checkout Intel XeSS SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: intel/xess
          ref: ${{ env.XESS_SDK_REF }}
          path: ${{ env.XESS_SDK_PATH }}
          sparse-checkout: |
            bin
            inc
      - name: Configure XeSS shim
        shell: pwsh
        env:
          XESS_SDK: ${{ github.workspace }}/${{ env.XESS_SDK_PATH }}
        run: >
          cmake -S native/xess_shim
          -B build/cmake/xess_shim
          -G "Visual Studio 17 2022"
          -A x64
      - name: Build XeSS shim
        shell: pwsh
        run: cmake --build build/cmake/xess_shim --config Release
      - name: Upload Windows XeSS shim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xessshim-windows-x64
          path: |
            build/native/xess_shim/release/xessshim.dll
            build/native/xess_shim/release/libxess.dll
          if-no-files-found: error

  native-linux:
    name: Build Linux NGX shim
    if: github.event_name != 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout DLSS SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools spirv-tools libvulkan-dev
      - name: Configure NGX shim
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
          VULKAN_SDK: /usr
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
      - name: Build NGX shim
        run: cmake --build build/cmake/ngx_shim --config Release
      - name: Upload Linux NGX shim
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ngxshim-linux-x64
          path: build/native/ngx_shim/release/libngxshim.so
          if-no-files-found: error

  package:
    name: Build bundled mod JAR
    if: github.event_name != 'workflow_dispatch' || inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs:
      - native-windows
      - native-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The vendor DLSS runtimes are never committed: they come from NVIDIA's own SDK checkout.
      - name: Checkout DLSS SDK (vendor runtimes only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle and cache dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install shader toolchain
        uses: ./.github/actions/shader-tools
        with:
          vulkan-sdk-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-sdk-sha256: ${{ env.VULKAN_SDK_SHA256 }}
          slang-version: ${{ env.SLANG_VERSION }}
      - name: Download NGX shims
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ngxshim-*
          path: build/native/ngx_shim/release
          merge-multiple: true
      - name: Download FSR shims
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fsrshim-*
          path: build/native/fsr_shim/release
          merge-multiple: true
      - name: Download NRD shims
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nrdshim-*
          path: build/native/nrd_shim/release
          merge-multiple: true
      - name: Download XeSS shims
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: xessshim-*
          path: build/native/xess_shim/release
          merge-multiple: true
      - name: Build the bundled JAR
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon build \
            -PngxPlatforms=windows-x64,linux-x64 \
            -PngxVendorConfig=${{ env.NGX_VENDOR_CONFIG }} \
            -PngxShimConfig=${{ env.NGX_SHIM_CONFIG }} 2>&1 | tee build-output.log
      - name: Verify the bundled JAR carries every requested native
        run: ./gradlew --no-daemon verifyModJar -PexpectBundledNatives=windows-x64,linux-x64
      - name: Inspect the actual mod JAR
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/libs/
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          from zipfile import ZipFile

          jars = sorted(p for p in Path('build/libs').glob('*.jar')
                        if not p.name.endswith(('-sources.jar', '-javadoc.jar')))
          if len(jars) != 1:
              raise SystemExit(f'Expected exactly one mod JAR, found: {jars}')
          jar = jars[0]
          with ZipFile(jar) as archive:
              metadata = json.loads(archive.read('fabric.mod.json'))
              natives = sorted({n.split('/')[2] for n in archive.namelist()
                                if n.startswith('caustica/natives/') and n.count('/') >= 3})
              shaders = [n for n in archive.namelist() if n.startswith('caustica/rt/')]
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          print(f'JAR: {jar} ({jar.stat().st_size} bytes)')
          print(f"version: {metadata['version']}  id: {metadata['id']}")
          print(f'bundled native platforms: {natives}')
          print(f'compiled shaders: {len(shaders)}')
          print(f'SHA-256: {digest}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'jar={jar.as_posix()}\nsha256={digest}\n')
          PYTHON
      - name: Summarise Gradle diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo "### Gradle diagnostics (bundled JAR)"
            echo '```'
            grep -n -iE "error:|cannot find symbol|does not exist|FAILED|What went wrong|Could not find|Caused by" build-output.log | head -n 200
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload bundled mod JAR (GPU runtime unverified)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: caustica-bundled-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            build-output.log
          if-no-files-found: error
