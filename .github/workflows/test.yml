name: JVM and ABI checks (no GPU)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test ABI verifier with synthetic Java 25 classfiles
        run: ./gradlew --no-daemon -p buildSrc test
      - name: Test RT CPU utilities, validate Minecraft signatures and packaged shaders
        run: ./gradlew --no-daemon check
      - name: Upload test and ABI reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
            buildSrc/build/reports/tests/
            buildSrc/build/test-results/
          if-no-files-found: ignore
