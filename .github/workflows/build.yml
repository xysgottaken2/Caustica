name: Build experimental Vulkan RT
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle, validate wrapper and cache dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # ShaderC natives are resolved by Gradle. No proprietary SDK or separate JNI layer.
      - name: Install SPIR-V validator
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      - name: Compile RT shaders and Java, verify Minecraft ABI and JAR
        run: ./gradlew --no-daemon build
      - name: Validate the SPIR-V consumed by the RT pipeline
        run: |
          for shader in build/generated/rt-shaders/assets/native_vulkan_rt/spirv/*.spv; do
            spirv-val --target-env vulkan1.2 "$shader"
          done
      - name: Upload experimental mod (GPU runtime unverified)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-vulkan-rt-experimental
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-verification
          path: build/reports/
          if-no-files-found: ignore
