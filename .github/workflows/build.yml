name: Build experimental Vulkan RT
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # A reusable invocation must not cancel the standalone build for the same ref.
  group: jar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle, validate wrapper and cache dependencies
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # ShaderC natives are resolved by Gradle. No proprietary SDK or separate JNI layer.
      - name: Install SPIR-V validator
        run: sudo apt-get update && sudo apt-get install -y spirv-tools
      # JUnit stays in the unchanged test job. A test failure must not skip JAR publication.
      - name: Assemble mod and verify Minecraft ABI and JAR
        run: ./gradlew --no-daemon assemble verifyMinecraftAbi verifyModJar
      - name: Validate the SPIR-V consumed by the RT pipeline
        run: |
          for shader in build/generated/rt-shaders/assets/native_vulkan_rt/spirv/*.spv; do
            spirv-val --target-env vulkan1.2 "$shader"
          done
      - name: Locate and inspect the actual mod JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/libs/
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          directory = Path('build/libs')
          jars = sorted(p for p in directory.glob('*.jar')
                        if p.is_file() and not p.name.endswith(('-sources.jar', '-javadoc.jar')))
          if len(jars) != 1:
              raise SystemExit(f'Expected exactly one mod JAR in {directory}, found: {jars}')
          jar = jars[0]
          if jar.stat().st_size == 0:
              raise SystemExit(f'Empty mod JAR: {jar}')
          with ZipFile(jar) as archive:
              metadata = json.loads(archive.read('fabric.mod.json'))
              if metadata.get('id') != 'native_vulkan_rt':
                  raise SystemExit(f'Not the expected mod: {metadata.get("id")}')
              for resource in ('dev/xys/vulkanrt/RayTracingMod.class', 'native_vulkan_rt.mixins.json',
                               'assets/native_vulkan_rt/spirv/primary.rgen.spv',
                               'assets/native_vulkan_rt/spirv/primary.rmiss.spv',
                               'assets/native_vulkan_rt/spirv/primary.rchit.spv'):
                  archive.getinfo(resource)
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          print(f'Verified mod JAR: {jar} ({jar.stat().st_size} bytes)')
          print(f'Mod version: {metadata["version"]}')
          print(f'SHA-256: {digest}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'path={jar.as_posix()}\nname={jar.name}\nsha256={digest}\n')
          PYTHON
      - name: Upload experimental mod (GPU runtime unverified)
        id: upload_jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-vulkan-rt-experimental
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
      - name: Report published mod artifact
        env:
          JAR_NAME: ${{ steps.jar.outputs.name }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
          JAR_SHA256: ${{ steps.jar.outputs.sha256 }}
          ARTIFACT_ID: ${{ steps.upload_jar.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_jar.outputs.artifact-url }}
        run: |
          test -n "$ARTIFACT_ID"
          echo "Published native-vulkan-rt-experimental: $JAR_PATH (artifact ID $ARTIFACT_ID)"
          echo "::notice title=Mod JAR published::JAR=$JAR_NAME; path=$JAR_PATH; artifact=native-vulkan-rt-experimental; artifact-id=$ARTIFACT_ID; SHA-256=$JAR_SHA256"
          {
            echo '## Download do mod'
            echo "- JAR: \`$JAR_NAME\`"
            echo "- Caminho verificado: \`$JAR_PATH\`"
            echo "- Artifact: [native-vulkan-rt-experimental]($ARTIFACT_URL)"
            echo "- SHA-256 do JAR: \`$JAR_SHA256\`"
            echo '- Testes executam em jobs independentes; este upload não depende deles.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-verification
          path: build/reports/
          if-no-files-found: ignore
